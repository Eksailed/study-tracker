name: Проверка проекта

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Сборка и тесты (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Получить исходники
        uses: actions/checkout@v7.0.1
      - name: Установить .NET 10
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Установить Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - name: Установить Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Восстановить зависимости
        run: dotnet restore
      - name: Восстановить инструменты EF Core
        run: dotnet tool restore
      - name: Собрать проект
        run: dotnet build --no-restore --nologo
      - name: Проверить синтаксис JavaScript
        run: node --check wwwroot/app.js
      - name: Проверить API и сохранение данных
        run: python tests/test_api.py
