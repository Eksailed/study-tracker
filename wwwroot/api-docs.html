    <section class="docs-block" aria-labelledby="docs-auth-title">
      <h2 id="docs-auth-title">Как войти</h2>
      <p>Токен выпускается в разделе «Доступ к API» в приложении и показывается один раз. Передавайте его в заголовке <code>Authorization</code>. Токен работает только на адресах <code>/api/v1</code>.</p>
      <pre class="docs-code">curl -H "Authorization: Bearer zt_…" <span class="docs-origin"></span>/api/v1/subjects</pre>
    </section>
    <p id="docs-error" class="docs-error" role="alert" hidden></p>
  </main>
