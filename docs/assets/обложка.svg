<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Зачёт — учебные задания без хаоса</title>
  <desc id="desc">Трекер учебных заданий: предметы, сроки и прогресс. ASP.NET Core 10 и SQLite.</desc>
  <defs>
